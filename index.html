<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
  <title>Chord Hoard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%231d5fa8%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-width=%223%22/%3E%3Ctext x=%2250%22 y=%2266%22 font-size=%2246%22 font-family=%22Georgia,serif%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%23ffffff%22%3E%E2%99%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chord Hoard">
  <script>
    // Offline support: register the service worker (no-op where unsupported).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-name"><a href="#/hoard">Chord Hoard</a></h1>
    <div class="header-controls">
      <button type="button" class="tint-toggle" data-tint-toggle aria-pressed="true" title="Colour chords by harmonic function" aria-label="Colour chords by harmonic function">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="7" cy="7" r="3.6" fill="var(--fn-tonic)"></circle>
          <circle cx="17" cy="7" r="3.6" fill="var(--fn-subdominant)"></circle>
          <circle cx="7" cy="17" r="3.6" fill="var(--fn-dominant)"></circle>
          <circle cx="17" cy="17" r="3.6" fill="var(--fn-borrowed)"></circle>
        </svg>
      </button>
      <div class="instrument-toggle" role="group" aria-label="Instrument">
        <button type="button" data-instrument="guitar" aria-pressed="false">Guitar</button>
        <button type="button" data-instrument="piano" aria-pressed="false">Piano</button>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/hoard" data-tab="hoard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10l2 11h14l2-11-9-7zm0 2.6 6.7 5.2L17.3 19H6.7L5.3 10.8 12 5.6z"/><circle cx="12" cy="13.5" r="2.4"/></svg>
      <span>Hoard</span>
    </a>
    <a href="#/chords" data-tab="chords">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg>
      <span>Chords</span>
    </a>
    <a href="#/scales" data-tab="scales">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h5v3H3v-3zm4.5-5h5v3h-5v-3zM12 8h5v3h-5V8zm4.5-5h5v3h-5V3z"/></svg>
      <span>Scales</span>
    </a>
    <a href="#/build" data-tab="build">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7V4z"/></svg>
      <span>Build</span>
    </a>
  </nav>

  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
